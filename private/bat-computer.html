<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bat-Ordinateur - Batcave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #00d4ff;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            padding: 20px;
        }
        .bat-header {
            text-align: center;
            margin-bottom: 40px;
            text-shadow: 0 0 10px #00d4ff;
        }
        .bat-header h1 {
            font-size: 3em;
            font-weight: bold;
            margin: 10px 0;
        }
        .welcome-message {
            background: rgba(0, 212, 255, 0.1);
            border: 2px solid #00d4ff;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 30px;
            text-align: center;
            font-size: 1.1em;
        }
        .arsenal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .gadget-card {
            background: rgba(0, 212, 255, 0.05);
            border: 2px solid #00d4ff;
            border-radius: 5px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }
        .gadget-card:hover {
            background: rgba(0, 212, 255, 0.15);
            transform: translateY(-5px);
            box-shadow: 0 0 20px #00d4ff;
        }
        .gadget-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #00d4ff;
        }
        .gadget-name {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .gadget-desc {
            font-size: 0.9em;
            color: #a0a0a0;
        }
        .report-section {
            background: rgba(0, 212, 255, 0.05);
            border: 2px solid #00d4ff;
            border-radius: 5px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .report-section h3 {
            margin-bottom: 15px;
            color: #00d4ff;
            text-shadow: 0 0 5px #00d4ff;
        }
        textarea {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #00d4ff;
            color: #00d4ff;
            border-radius: 5px;
            padding: 10px;
            width: 100%;
            font-family: 'Courier New', monospace;
            min-height: 100px;
        }
        textarea:focus {
            outline: none;
            box-shadow: 0 0 10px #00d4ff;
        }
        .btn-submit {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            border: none;
            color: #1a1a2e;
            font-weight: bold;
            border-radius: 5px;
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px #00d4ff;
        }
        .loading {
            text-align: center;
            color: #00d4ff;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="bat-header">
            <h1>🦇 BAT-ORDINATEUR 🦇</h1>
            <p>Système d'accès sécurisé de la Batcave</p>
        </div>

        <div class="welcome-message" id="welcomeMessage">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i> Chargement...
            </div>
        </div>

        <h2 style="color: #00d4ff; margin-top: 30px;">Arsenal disponible:</h2>
        <div class="arsenal-grid" id="arsenalGrid">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i> Chargement de l'arsenal...
            </div>
        </div>

        <div class="report-section">
            <h3>📝 Note de Mission</h3>
            <form id="reportForm">
                <textarea id="reportContent" placeholder="Entrez votre rapport de mission ici..." required></textarea>
                <button type="submit" class="btn-submit mt-3">
                    <i class="fas fa-paper-plane"></i> Envoyer le Rapport
                </button>
            </form>
            <div id="reportMessage" style="margin-top: 10px;"></div>
        </div>
    </div>

    <script>
        // Demander les identifiants une seule fois au chargement
        let username = sessionStorage.getItem('batUsername');
        let password = sessionStorage.getItem('batPassword');

        if (!username || !password) {
            const auth = prompt('🦇 Bienvenue à la Batcave!\n\nEntrez vos identifiants\n(format: username:password)');
            if (auth) {
                const [u, p] = auth.split(':');
                username = u;
                password = p;
                sessionStorage.setItem('batUsername', u);
                sessionStorage.setItem('batPassword', p);
            } else {
                document.body.innerHTML = '<div style="display: flex; align-items: center; justify-content: center; height: 100vh; color: #00d4ff; font-size: 1.2em;">Accès refusé. Vous devez vous authentifier.</div>';
            }
        }

        // Fonction pour créer le header Basic Auth
        function getAuthHeader() {
            return 'Basic ' + btoa(username + ':' + password);
        }

        // Charger les infos utilisateur
        async function loadUserInfo() {
            try {
                const response = await fetch('/api/me', {
                    headers: {
                        'Authorization': getAuthHeader()
                    }
                });
                if (response.ok) {
                    const user = await response.json();
                    document.getElementById('welcomeMessage').innerHTML = 
                        `<strong>Bienvenue, Justicier ${user.username}! 🦇</strong>`;
                } else {
                    document.getElementById('welcomeMessage').innerHTML = 
                        '<div class="alert alert-danger">Authentification échouée. Identifiants invalides.</div>';
                }
            } catch (err) {
                console.error('Erreur:', err);
                document.getElementById('welcomeMessage').innerHTML = 
                    '<div class="alert alert-danger">Erreur de connexion au serveur</div>';
            }
        }

        // Charger l'arsenal
        async function loadArsenal() {
            try {
                const response = await fetch('/api/secrets', {
                    headers: {
                        'Authorization': getAuthHeader()
                    }
                });
                if (response.ok) {
                    const secrets = await response.json();
                    const grid = document.getElementById('arsenalGrid');
                    grid.innerHTML = '';
                    secrets.forEach(gadget => {
                        const card = document.createElement('div');
                        card.className = 'gadget-card';
                        card.innerHTML = `
                            <div class="gadget-icon">
                                <i class="fas ${gadget.icon}"></i>
                            </div>
                            <div class="gadget-name">${gadget.name}</div>
                            <div class="gadget-desc">${gadget.desc}</div>
                        `;
                        grid.appendChild(card);
                    });
                } else {
                    document.getElementById('arsenalGrid').innerHTML = 
                        '<div class="alert alert-danger">Erreur lors du chargement de l\'arsenal</div>';
                }
            } catch (err) {
                console.error('Erreur:', err);
                document.getElementById('arsenalGrid').innerHTML = 
                    '<div class="alert alert-danger">Erreur de connexion</div>';
            }
        }

        // Envoyer un rapport
        document.getElementById('reportForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const content = document.getElementById('reportContent').value;
            const messageDiv = document.getElementById('reportMessage');

            try {
                const response = await fetch('/api/reports', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': getAuthHeader()
                    },
                    body: JSON.stringify({ content })
                });

                if (response.ok) {
                    messageDiv.innerHTML = '<div class="alert alert-success"><i class="fas fa-check"></i> Rapport enregistré avec succès!</div>';
                    document.getElementById('reportContent').value = '';
                } else {
                    const error = await response.json();
                    messageDiv.innerHTML = `<div class="alert alert-danger">Erreur: ${error.message}</div>`;
                }
            } catch (err) {
                messageDiv.innerHTML = '<div class="alert alert-danger">Erreur serveur</div>';
                console.error(err);
            }
        });

        // Charger au démarrage
        if (username && password) {
            loadUserInfo();
            loadArsenal();
        }
    </script>
</body>
</html>
